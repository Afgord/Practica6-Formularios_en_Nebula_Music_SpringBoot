<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nébula Music - Iniciar Sesión</title>

    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body>

<main class="auth-container">

    <section class="auth-card">

        <a class="auth-logo" href="/index">
            <img src="/imgs/nebula-03.svg"
                 alt="Logo Nébula">
        </a>

        <header class="auth-header">
            <h1>Iniciar Sesión</h1>

            <p>
                Ingresa tus credenciales para acceder
            </p>
        </header>

        <form class="auth-form"
              method="post"
              action="/autentication"
              enctype="application/x-www-form-urlencoded">

            <div class="form-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input type="email"
                       id="email"
                       name="correo"
                       placeholder="correo@ejemplo.com"
                       autocomplete="email"
                       required
                       minlength="5"
                       maxlength="100">

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Ingresa tu contraseña"
                       autocomplete="current-password"
                       required>

            </div>


            <div class="form-actions">

                <button type="submit"
                        class="btn-primary">
                    Iniciar sesión
                </button>

                <a href="/index"
                   class="btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>


        <p class="auth-register">
            ¿Aún no tienes cuenta?
            <a href="/registro">
                Regístrate aquí
            </a>
        </p>

    </section>

</main>


<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>

</html>
