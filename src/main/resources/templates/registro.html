<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nébula Music - Registro</title>

    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body>

<main class="auth-container">

    <section class="auth-card">

        <a class="auth-logo" href="/index">
            <img src="/imgs/nebula-03.svg"
                 alt="Logo Nébula">
        </a>

        <header class="auth-header">
            <h1>Crear Cuenta</h1>
            <p>Completa tus datos para registrarte</p>
        </header>

        <form class="auth-form"
              method="post"
              action="/crear-cuenta"
              enctype="application/x-www-form-urlencoded">

            <div class="form-group">
                <label for="nombre">
                    Nombre completo
                </label>

                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Ingresa tu nombre completo"
                       minlength="3"
                       maxlength="80"
                       required>
            </div>


            <div class="form-group">
                <label for="correo">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="Ingresa tu correo electrónico"
                       maxlength="100"
                       required>
            </div>


            <div class="form-group">
                <label for="password">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Ingresa tu contraseña"
                       minlength="8"
                       autocomplete="off"
                       required>
            </div>


            <div class="form-group">
                <label for="pseudonimo">
                    Pseudónimo
                </label>

                <input type="text"
                       id="pseudonimo"
                       name="pseudonimo"
                       placeholder="Nebula-2025"
                       pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                       minlength="6"
                       required>
            </div>


            <div class="form-group">

                <label>
                    Género
                </label>

                <div class="radio-group">

                    <label for="rad_femenino">
                        <input type="radio"
                               id="rad_femenino"
                               name="genero"
                               value="femenino"
                               required>
                        Femenino
                    </label>

                    <label for="rad_masculino">
                        <input type="radio"
                               id="rad_masculino"
                               name="genero"
                               value="masculino"
                               required>
                        Masculino
                    </label>

                    <label for="rad_otro">
                        <input type="radio"
                               id="rad_otro"
                               name="genero"
                               value="otro"
                               required>
                        Otro
                    </label>

                </div>

            </div>


            <div class="form-group">
                <label for="suscripcion">
                    Tipo de suscripción
                </label>

                <select id="suscripcion"
                        name="suscripcion"
                        required>

                    <option value="">
                        ----Selecciona una opción----
                    </option>

                    <option value="gratis">
                        Gratis (con anuncios)
                    </option>

                    <option value="premium_mensual">
                        Premium mensual ($99/mes)
                    </option>

                    <option value="premium_anual">
                        Premium anual ($899/año)
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="fecha_nacimiento">
                    Fecha de nacimiento
                </label>

                <input type="date"
                       id="fecha_nacimiento"
                       name="fechaNacimiento"
                       required>
            </div>


            <div class="checkbox-group">

                <input type="checkbox"
                       id="terminos"
                       name="terminos"
                       value="aceptado"
                       required>

                <label for="terminos">
                    Acepto los términos y condiciones de uso
                </label>

            </div>


            <div class="form-group">
                <label for="comentarios">
                    Comentarios o gustos
                </label>

                <textarea id="comentarios"
                          name="comentarios"
                          rows="4"
                          placeholder="Cuéntanos qué música te gusta"></textarea>
            </div>


            <div class="register-actions">

                <button type="submit"
                        class="btn-primary">
                    Crear cuenta
                </button>

                <button type="reset"
                        class="btn-secondary">
                    Limpiar formulario
                </button>

            </div>


            <p class="auth-register">
                ¿Ya tienes una cuenta?
                <a href="/iniciar-sesion">
                    Iniciar sesión
                </a>
            </p>

        </form>

    </section>

</main>


<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>

</html>
