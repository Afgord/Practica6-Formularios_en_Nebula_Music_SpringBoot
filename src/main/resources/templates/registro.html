<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>Crear Cuenta</h1>
                <div>
                    <label for="nombre">Nombre completo: </label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" minlength="3" maxlength="80" required>
                </div>
                <div>
                    <label for="correo">Correo electrónico: </label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="Ingresa tu correo electrónico"
                           maxlength="100"
                           required>
                </div>
                <div>
                    <label for="password">Password: </label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Ingresa tu password"
                           minlength="8"
                           autocomplete="off"
                              required>
                </div>
                <div>
                    <label for="pseudonimo">Pseudónimo</label>
                    <input type="text"
                           id="pseudonimo"
                           name="pseudonimo"
                           required
                           pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                           placeholder="Nebula-2025"
                           minlength="6">
                </div>
                <div>
                   <label>Género: </label>
                    <label for="rad_femenino">Femenino</label>
                    <input
                            type="radio"
                            id="rad_femenino"
                            name="genero"
                            value="femenino"
                            required>
                    <label for="rad_masculino">Masculino</label>
                    <input
                            type="radio"
                            id="rad_masculino"
                            name="genero"
                            value="masculino"
                            required>
                    <label for="rad_otro">Otro</label>
                    <input type="radio"
                           id="rad_otro"
                           name="genero"
                           value="otro"
                           required>
                </div>
                <div>
                    <label for="suscripcion">Tipo de suscripción</label>
                    <select id="suscripcion"
                            name="suscripcion"
                            required>
                        <option value="">----Selecciona una opción----</option>
                        <option value="gratis">Gratis (con anuncios)</option>
                        <option value="premium_mensual">Premium mensual ($99/mes)</option>
                        <option value="premium_anual">Premium anual ($899/año)</option>
                    </select>
                </div>
                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha_nacimiento" name="fechaNacimiento" required>
                </div>
                <div>
                    <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los términos y condiciones de uso</label>
                </div>
                <div>
                    <label for="comentarios">Comentarios o gustos</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Cuentanos que música te gusta"></textarea>
                </div>

                <button type="submit">
                    Crear cuenta
                </button>
                <button type="reset">
                    Limpiar formulario
                </button>

                <p>¿Ya tienes una cuenta? <a href="/iniciar-sesion">Iniciar sesión</a></p>
            </form>
        </section>
    </main>
    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
